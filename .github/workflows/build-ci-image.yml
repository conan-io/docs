name: Build CI image

on:
  push:
    branches:
      - master
    paths:
      - 'requirements.txt'
      - '.github/docker/ci-docs.Dockerfile'
      - '.github/workflows/build-ci-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/ci-docs.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/docs-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
