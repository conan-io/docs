name: Docs test build

on:
  workflow_dispatch:
  push:
    branches:
      - develop2
  pull_request:
    branches:
      - develop2

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/docs-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Clone Conan sources for autodoc
        run: |
          # github.ref_name is the PR merge ref (e.g. "4536/merge") on
          # pull_request events, not a real branch, so it can't be used to
          # clone conan-io/conan directly. Use base_ref (always "develop2"
          # here) when set, falling back to ref_name for push events.
          target="${{ github.base_ref || github.ref_name }}"
          git clone --single-branch -b "$target" --depth 1 https://github.com/conan-io/conan.git conan_sources

      - name: Install Conan sources
        run: |
          pip install -e conan_sources
          conan --version

      - name: Build HTML
        run: make html

      - name: Build LaTeX sources
        run: make latex
